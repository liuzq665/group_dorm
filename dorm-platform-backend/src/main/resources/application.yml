server:
  port: 8080
logging:
  file:
    name: ../log/dorm-platform-backend.log
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://localhost:3306/dorm_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

backup:
  executable: ${BACKUP_EXECUTABLE:mysqldump}

assistant:
  api-key: ${ASSISTANT_API_KEY:}
  base-url: ${ASSISTANT_BASE_URL:https://api.hanhegufei.online/v1}
  protocol: ${ASSISTANT_PROTOCOL:OPENAI_CHAT}
  model: ${ASSISTANT_MODEL:claude-opus-4-8}
  max-tokens: ${ASSISTANT_MAX_TOKENS:1200}
  actor-authorization: ${ASSISTANT_ACTOR_AUTHORIZATION:local-image-extension}
# 附件落盘目录：相对路径按进程工作目录解析，可用环境变量 FILE_STORAGE_DIR 指定绝对路径
dorm:
  file:
    storage-dir: ${FILE_STORAGE_DIR:uploads}


